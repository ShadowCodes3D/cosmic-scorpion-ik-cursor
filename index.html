<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Cyber Scorpion IK</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #050208;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
</style>
</head>
<body>

<script>
  const RENDER_WIDTH = 1080;
  const RENDER_HEIGHT = 1320;
  const TARGET_FPS = 60;

  const canvas = document.createElement('canvas');
  canvas.width = RENDER_WIDTH;
  canvas.height = RENDER_HEIGHT;
  document.body.appendChild(canvas);

  const ctx = canvas.getContext('2d');

  // --- 1. Procedural Cosmic Nebula & Starfield Background ---
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = RENDER_WIDTH;
  bgCanvas.height = RENDER_HEIGHT;
  const bgCtx = bgCanvas.getContext('2d');

  function buildCosmicBackground() {
    const baseGrad = bgCtx.createRadialGradient(
      RENDER_WIDTH * 0.5, RENDER_HEIGHT * 0.45, 60,
      RENDER_WIDTH * 0.5, RENDER_HEIGHT * 0.5, 950
    );
    baseGrad.addColorStop(0, '#1a0b12');
    baseGrad.addColorStop(0.55, '#0b050d');
    baseGrad.addColorStop(1, '#020104');
    bgCtx.fillStyle = baseGrad;
    bgCtx.fillRect(0, 0, RENDER_WIDTH, RENDER_HEIGHT);

    bgCtx.globalCompositeOperation = 'screen';
    const clouds = [
      { x: 260, y: 340, r: 440, c1: 'rgba(255, 165, 45, 0.22)', c2: 'rgba(180, 45, 25, 0.08)' },
      { x: 820, y: 460, r: 480, c1: 'rgba(255, 190, 70, 0.24)', c2: 'rgba(140, 30, 50, 0.09)' },
      { x: 460, y: 740, r: 520, c1: 'rgba(235, 120, 35, 0.20)', c2: 'rgba(110, 20, 45, 0.08)' },
      { x: 760, y: 1020, r: 450, c1: 'rgba(255, 175, 55, 0.19)', c2: 'rgba(130, 35, 30, 0.07)' },
      { x: 220, y: 1050, r: 400, c1: 'rgba(190, 60, 35, 0.18)', c2: 'rgba(60, 15, 40, 0.05)' },
      { x: 540, y: 260, r: 360, c1: 'rgba(0, 180, 220, 0.09)', c2: 'rgba(40, 10, 60, 0.03)' }
    ];

    clouds.forEach(cl => {
      const g = bgCtx.createRadialGradient(cl.x, cl.y, 10, cl.x, cl.y, cl.r);
      g.addColorStop(0, cl.c1);
      g.addColorStop(0.5, cl.c2);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = g;
      bgCtx.beginPath();
      bgCtx.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2);
      bgCtx.fill();
    });

    for (let i = 0; i < 420; i++) {
      const u = Math.random();
      const bx = u * RENDER_WIDTH + (Math.random() - 0.5) * 260;
      const by = (1.0 - u * 0.65) * RENDER_HEIGHT * 0.85 + (Math.random() - 0.5) * 280;
      const rad = 18 + Math.random() * 65;
      const g = bgCtx.createRadialGradient(bx, by, 0, bx, by, rad);
      const warm = Math.random() > 0.25;
      g.addColorStop(0, warm ? 'rgba(255, 200, 110, 0.055)' : 'rgba(120, 220, 255, 0.045)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = g;
      bgCtx.beginPath();
      bgCtx.arc(bx, by, rad, 0, Math.PI * 2);
      bgCtx.fill();
    }

    for (let i = 0; i < 650; i++) {
      const sx = Math.random() * RENDER_WIDTH;
      const sy = Math.random() * RENDER_HEIGHT;
      const sr = Math.random() * 1.6 + 0.3;
      const alpha = 0.25 + Math.random() * 0.75;
      bgCtx.fillStyle = Math.random() > 0.3
        ? `rgba(255, 240, 215, ${alpha})`
        : `rgba(150, 235, 255, ${alpha})`;
      bgCtx.beginPath();
      bgCtx.arc(sx, sy, sr, 0, Math.PI * 2);
      bgCtx.fill();
    }
    bgCtx.globalCompositeOperation = 'source-over';
  }
  buildCosmicBackground();

  const dynamicStars = Array.from({ length: 95 }, () => ({
    x: Math.random() * RENDER_WIDTH,
    y: Math.random() * RENDER_HEIGHT,
    r: 0.8 + Math.random() * 1.8,
    phase: Math.random() * Math.PI * 2,
    speed: 1.5 + Math.random() * 3.0,
    gold: Math.random() > 0.45
  }));

  // --- 2. Procedural Inverse Kinematics Engine ---
  class Segment {
    constructor(parent, size, angle, range, stiffness, width = 2.6) {
      this.isSegment = true;
      this.parent = parent;
      if (parent.children) parent.children.push(this);
      this.children = [];
      this.size = size;
      this.relAngle = angle;
      this.defAngle = angle;
      this.absAngle = parent.absAngle + angle;
      this.range = range;
      this.stiffness = stiffness;
      this.width = width;
      this.x = parent.x + Math.cos(this.absAngle) * size;
      this.y = parent.y + Math.sin(this.absAngle) * size;
    }

    updateRelative(iter, flex) {
      this.relAngle =
        this.relAngle -
        2 * Math.PI * Math.floor((this.relAngle - this.defAngle) / (2 * Math.PI) + 0.5);
      if (flex) {
        this.relAngle = Math.min(
          this.defAngle + this.range / 2,
          Math.max(
            this.defAngle - this.range / 2,
            (this.relAngle - this.defAngle) / this.stiffness + this.defAngle
          )
        );
      }
      this.absAngle = this.parent.absAngle + this.relAngle;
      this.x = this.parent.x + Math.cos(this.absAngle) * this.size;
      this.y = this.parent.y + Math.sin(this.absAngle) * this.size;
      if (iter) {
        for (let i = 0; i < this.children.length; i++) {
          this.children[i].updateRelative(iter, flex);
        }
      }
    }

    draw(iter) {
      ctx.lineWidth = this.width;
      ctx.beginPath();
      ctx.moveTo(this.parent.x, this.parent.y);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(this.x, this.y, Math.max(2.2, this.width * 0.95), 0, Math.PI * 2);
      ctx.fill();

      if (iter) {
        for (let i = 0; i < this.children.length; i++) {
          this.children[i].draw(true);
        }
      }
    }

    follow(iter) {
      const x = this.parent.x;
      const y = this.parent.y;
      const dist = Math.max(Math.hypot(this.x - x, this.y - y), 0.0001);
      this.x = x + (this.size * (this.x - x)) / dist;
      this.y = y + (this.size * (this.y - y)) / dist;
      this.absAngle = Math.atan2(this.y - y, this.x - x);
      this.relAngle = this.absAngle - this.parent.absAngle;
      this.updateRelative(false, true);
      if (iter) {
        for (let i = 0; i < this.children.length; i++) {
          this.children[i].follow(true);
        }
      }
    }
  }

  class LimbSystem {
    constructor(end, length, speed, creature) {
      this.end = end;
      this.length = Math.max(1, length);
      this.creature = creature;
      this.speed = speed;
      creature.systems.push(this);
      this.nodes = [];
      let node = end;
      for (let i = 0; i < length; i++) {
        this.nodes.unshift(node);
        node = node.parent;
        if (!node.isSegment) {
          this.length = i + 1;
          break;
        }
      }
      this.hip = this.nodes[0].parent;
    }

    moveTo(x, y) {
      this.nodes[0].updateRelative(true, true);
      const dist = Math.hypot(x - this.end.x, y - this.end.y);
      let len = Math.max(0, dist - this.speed);
      for (let i = this.nodes.length - 1; i >= 0; i--) {
        const node = this.nodes[i];
        const ang = Math.atan2(node.y - y, node.x - x);
        node.x = x + len * Math.cos(ang);
        node.y = y + len * Math.sin(ang);
        x = node.x;
        y = node.y;
        len = node.size;
      }
      for (let i = 0; i < this.nodes.length; i++) {
        const node = this.nodes[i];
        node.absAngle = Math.atan2(node.y - node.parent.y, node.x - node.parent.x);
        node.relAngle = node.absAngle - node.parent.absAngle;
        for (let ii = 0; ii < node.children.length; ii++) {
          const childNode = node.children[ii];
          if (!this.nodes.includes(childNode)) {
            childNode.updateRelative(true, false);
          }
        }
      }
    }

    update(tx, ty) {
      this.moveTo(tx, ty);
    }
  }

  class LegSystem extends LimbSystem {
    constructor(end, length, speed, creature) {
      super(end, length, speed, creature);
      this.goalX = end.x;
      this.goalY = end.y;
      this.step = 0;
      this.forwardness = 0;

      this.reach = 0.92 * Math.hypot(this.end.x - this.hip.x, this.end.y - this.hip.y);
      let relAngle =
        this.creature.absAngle -
        Math.atan2(this.end.y - this.hip.y, this.end.x - this.hip.x);
      relAngle -= 2 * Math.PI * Math.floor(relAngle / (2 * Math.PI) + 0.5);
      this.swing = -relAngle + (2 * (relAngle < 0) - 1) * (Math.PI / 2);
      this.swingOffset = this.creature.absAngle - this.hip.absAngle;
    }

    update() {
      this.moveTo(this.goalX, this.goalY);
      if (this.step === 0) {
        const dist = Math.hypot(this.end.x - this.goalX, this.end.y - this.goalY);
        if (dist > 1.5) {
          this.step = 1;
          this.goalX =
            this.hip.x +
            this.reach * Math.cos(this.swing + this.hip.absAngle + this.swingOffset) +
            ((2 * Math.random() - 1) * this.reach) / 3.2;
          this.goalY =
            this.hip.y +
            this.reach * Math.sin(this.swing + this.hip.absAngle + this.swingOffset) +
            ((2 * Math.random() - 1) * this.reach) / 3.2;
        }
      } else if (this.step === 1) {
        const theta =
          Math.atan2(this.end.y - this.hip.y, this.end.x - this.hip.x) - this.hip.absAngle;
        const dist = Math.hypot(this.end.x - this.hip.x, this.end.y - this.hip.y);
        const forwardness2 = dist * Math.cos(theta);
        const dF = this.forwardness - forwardness2;
        this.forwardness = forwardness2;
        if (dF * dF < 0.003) {
          this.step = 0;
          this.goalX = this.hip.x + (this.end.x - this.hip.x);
          this.goalY = this.hip.y + (this.end.y - this.hip.y);
        }
      }
    }
  }

  class Creature {
    constructor(x, y, angle, fAccel, fFric, fRes, fThresh, rAccel, rFric, rRes, rThresh) {
      this.x = x;
      this.y = y;
      this.absAngle = angle;
      this.fSpeed = 0;
      this.fAccel = fAccel;
      this.fFric = fFric;
      this.fRes = fRes;
      this.fThresh = fThresh;
      this.rSpeed = 0;
      this.rAccel = rAccel;
      this.rFric = rFric;
      this.rRes = rRes;
      this.rThresh = rThresh;
      this.children = [];
      this.systems = [];
    }

    follow(x, y) {
      const dist = Math.hypot(this.x - x, this.y - y);
      const angle = Math.atan2(y - this.y, x - this.x);

      let accel = this.fAccel;
      if (this.systems.length > 0) {
        let sum = 0;
        for (let i = 0; i < this.systems.length; i++) {
          sum += this.systems[i].step === 0 ? 1 : 0;
        }
        accel *= sum / this.systems.length;
      }
      this.fSpeed += accel * (dist > this.fThresh ? 1 : 0);
      this.fSpeed *= 1 - this.fRes;
      this.speed = Math.max(0, this.fSpeed - this.fFric);

      let dif = this.absAngle - angle;
      dif -= 2 * Math.PI * Math.floor(dif / (2 * Math.PI) + 0.5);
      if (Math.abs(dif) > this.rThresh && dist > this.fThresh) {
        this.rSpeed -= this.rAccel * (2 * (dif > 0) - 1);
      }
      this.rSpeed *= 1 - this.rRes;
      if (Math.abs(this.rSpeed) > this.rFric) {
        this.rSpeed -= this.rFric * (2 * (this.rSpeed > 0) - 1);
      } else {
        this.rSpeed = 0;
      }

      this.absAngle += this.rSpeed;
      this.absAngle -= 2 * Math.PI * Math.floor(this.absAngle / (2 * Math.PI) + 0.5);
      this.x += this.speed * Math.cos(this.absAngle);
      this.y += this.speed * Math.sin(this.absAngle);

      this.absAngle += Math.PI;
      for (let i = 0; i < this.children.length; i++) {
        this.children[i].follow(true);
      }
      for (let i = 0; i < this.systems.length; i++) {
        this.systems[i].update(x, y);
      }
      this.absAngle -= Math.PI;
      this.draw(true);
    }

    draw(iter) {
      const r = 10;
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.arc(
        this.x,
        this.y,
        r,
        Math.PI / 4 + this.absAngle,
        (7 * Math.PI) / 4 + this.absAngle
      );
      ctx.moveTo(
        this.x + r * Math.cos((7 * Math.PI) / 4 + this.absAngle),
        this.y + r * Math.sin((7 * Math.PI) / 4 + this.absAngle)
      );
      ctx.lineTo(
        this.x + r * Math.cos(this.absAngle) * Math.SQRT2,
        this.y + r * Math.sin(this.absAngle) * Math.SQRT2
      );
      ctx.lineTo(
        this.x + r * Math.cos(Math.PI / 4 + this.absAngle),
        this.y + r * Math.sin(Math.PI / 4 + this.absAngle)
      );
      ctx.stroke();

      if (iter) {
        for (let i = 0; i < this.children.length; i++) {
          this.children[i].draw(true);
        }
      }
    }
  }

  // --- 3. Build Large Neon-Cyan Skeletal Scorpion ---
  let critter;
  function buildScorpion() {
    const s = 2.45;
    critter = new Creature(
      RENDER_WIDTH * 0.45,
      RENDER_HEIGHT * 0.58,
      -0.4,
      11.5 * s,
      1.8 * s,
      0.48,
      22 * s,
      1.35,
      0.075,
      0.48,
      0.26
    );

    let spinal = critter;

    spinal = new Segment(spinal, 9 * s, 0, Math.PI, 1.1, 3.2);
    for (let ii = -1; ii <= 1; ii += 2) {
      let arm1 = new Segment(spinal, 17 * s, ii * 1.1, 0.28, 2, 3.0);
      let arm2 = new Segment(arm1, 22 * s, -ii * 0.52, 0.35, 2, 3.2);
      let palm = new Segment(arm2, 20 * s, -ii * 0.58, 0.45, 2, 3.6);
      let bladeOut = new Segment(palm, 16 * s, -ii * 0.42, 0.4, 2, 2.8);
      new Segment(bladeOut, 11 * s, ii * 0.35, 0.3, 2, 2.2);
      let bladeIn = new Segment(palm, 14 * s, ii * 0.32, 0.4, 2, 2.6);
      new Segment(bladeIn, 9 * s, -ii * 0.3, 0.3, 2, 2.0);
    }

    for (let i = 0; i < 4; i++) {
      const segW = 3.6 - i * 0.15;
      spinal = new Segment(spinal, 15 * s, 0, 1.35, 1.5, segW);

      for (let ii = -1; ii <= 1; ii += 2) {
        let plate = new Segment(spinal, 13 * s, ii * 1.52, 0.08, 2, 2.5);
        new Segment(plate, 9 * s, ii * 0.45, 0.08, 2, 2.0);

        let hip = new Segment(spinal, 14 * s, ii * 1.57, 0.14, 2, 2.8);
        let femur = new Segment(hip, 22 * s, -ii * 0.34, 2.2, 1.5, 2.6);
        let tibia = new Segment(femur, 24 * s, ii * 0.34, 1.6, 1.5, 2.3);
        let tarsus = new Segment(tibia, 18 * s, ii * 0.46, 1.6, 1.5, 1.9);
        new LegSystem(tarsus, 3, 15 * s, critter);
      }
    }

    const tailSegments = 16;
    for (let i = 0; i < tailSegments; i++) {
      const taper = 1.0 - (i / tailSegments) * 0.35;
      const w = Math.max(2.0, 3.2 * taper);
      spinal = new Segment(spinal, 13.5 * s * taper, 0, 1.18, 1.45, w);
      if (i < 5) {
        for (let ii = -1; ii <= 1; ii += 2) {
          let rib = new Segment(spinal, 11 * s * taper, ii * 1.42, 0.1, 2, 2.1);
          new Segment(rib, 7 * s * taper, -ii * 0.45, 0.1, 2, 1.7);
        }
      }
    }
    const bulb = new Segment(spinal, 11 * s, 0.28, 0.85, 1.5, 3.0);
    new Segment(bulb, 14 * s, 0.48, 0.65, 1.5, 2.2);
  }

  buildScorpion();

  // --- 4. Radiant Golden Singularity Orb + Intro Shockwave ---
  function drawTargetOrb(tx, ty, t, introFactor) {
    const scale = 0.2 + 0.8 * introFactor;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.scale(scale, scale);

    if (t < 2.2) {
      const waveP = t / 2.2;
      const waveR = 25 + waveP * 340;
      const waveAlpha = (1.0 - waveP) * 0.65;
      ctx.strokeStyle = `rgba(255, 200, 80, ${waveAlpha})`;
      ctx.lineWidth = 3.0 * (1.0 - waveP * 0.6);
      ctx.beginPath();
      ctx.arc(0, 0, waveR, 0, Math.PI * 2);
      ctx.stroke();
    }

    const outerGlow = ctx.createRadialGradient(0, 0, 6, 0, 0, 95);
    outerGlow.addColorStop(0, 'rgba(255, 235, 170, 0.95)');
    outerGlow.addColorStop(0.28, 'rgba(255, 175, 45, 0.55)');
    outerGlow.addColorStop(0.62, 'rgba(245, 105, 15, 0.18)');
    outerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(0, 0, 95, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.rotate(-0.22 + Math.sin(t * 0.8) * 0.08);
    ctx.strokeStyle = 'rgba(255, 215, 110, 0.85)';
    ctx.lineWidth = 4.5;
    ctx.shadowColor = '#ffae00';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.ellipse(0, 0, 64 + Math.sin(t * 4) * 3, 14, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 250, 225, 0.9)';
    ctx.lineWidth = 2.0;
    ctx.beginPath();
    ctx.ellipse(0, 0, 50, 9, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = 'rgba(255, 220, 130, 0.95)';
    ctx.lineWidth = 3.5;
    ctx.shadowColor = '#ffbe0b';
    ctx.shadowBlur = 22;
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#050206';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 8; i++) {
      const ang = t * 2.4 + (i * Math.PI) / 4;
      const rad = 36 + Math.sin(t * 3 + i) * 6;
      ctx.fillStyle = 'rgba(255, 240, 190, 0.9)';
      ctx.beginPath();
      ctx.arc(Math.cos(ang) * rad, Math.sin(ang) * rad * 0.65, 2.0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  // --- 5. Pointer & Autonomous Hunting Path ---
  const pointer = {
    x: RENDER_WIDTH * 0.68,
    y: RENDER_HEIGHT * 0.34,
    lastMoveTime: -9999
  };

  window.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * RENDER_WIDTH;
    pointer.y = ((e.clientY - rect.top) / rect.height) * RENDER_HEIGHT;
    pointer.lastMoveTime = performance.now();
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = ((e.touches[0].clientX - rect.left) / rect.width) * RENDER_WIDTH;
      pointer.y = ((e.touches[0].clientY - rect.top) / rect.height) * RENDER_HEIGHT;
      pointer.lastMoveTime = performance.now();
    }
  }, { passive: true });

  // --- 6. Optional Canvas Recorder (Press 'R' to start/stop, 'Space' to replay intro) ---
  let elapsed = 0;
  let lastNow = performance.now();
  let isRecording = false;
  let mediaRecorder = null;
  let recordedChunks = [];

  function resetAnimation() {
    elapsed = 0;
    lastNow = performance.now();
    pointer.lastMoveTime = -9999;
    buildScorpion();
  }

  function startRecording() {
    if (isRecording) return;
    resetAnimation();
    recordedChunks = [];

    const stream = canvas.captureStream(TARGET_FPS);
    const mimeTypes = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    const selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';
    const ext = selectedMime.includes('mp4') ? 'mp4' : 'webm';

    try {
      mediaRecorder = new MediaRecorder(stream, {
        mimeType: selectedMime || undefined,
        videoBitsPerSecond: 14000000
      });
    } catch (e) {
      mediaRecorder = new MediaRecorder(stream);
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: selectedMime || 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Cosmic-Scorpion-IK.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      isRecording = false;
    };

    isRecording = true;
    mediaRecorder.start(100);
  }

  function stopRecording() {
    if (!isRecording) return;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    isRecording = false;
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'KeyR') {
      if (!isRecording) startRecording();
      else stopRecording();
    }
    if (e.code === 'Space' && !isRecording) resetAnimation();
  });

  function smoothstep(x) {
    const t = Math.min(Math.max(x, 0), 1);
    return t * t * (3 - 2 * t);
  }

  // --- 7. Main Render Loop (Endless Smooth Motion) ---
  function animate(now) {
    requestAnimationFrame(animate);
    const delta = Math.min((now - lastNow) / 1000, 0.05);
    lastNow = now;
    elapsed += delta;

    const t = elapsed;
    const introOrb = smoothstep(t / 1.2);
    const introScorpion = smoothstep((t - 0.9) / 1.9);

    ctx.drawImage(bgCanvas, 0, 0);

    for (let i = 0; i < dynamicStars.length; i++) {
      const st = dynamicStars[i];
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * st.speed + st.phase));
      ctx.fillStyle = st.gold
        ? `rgba(255, 225, 165, ${tw})`
        : `rgba(140, 240, 255, ${tw})`;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }

    let targetX, targetY;
    const userActive = now - pointer.lastMoveTime < 3500;

    if (userActive) {
      targetX = pointer.x;
      targetY = pointer.y;
    } else {
      const cx = RENDER_WIDTH * 0.5;
      const cy = RENDER_HEIGHT * 0.52;
      const pathX = cx + Math.sin(t * 0.62) * 290 + Math.cos(t * 1.24) * 65;
      const pathY = cy + Math.sin(t * 1.05) * 340 + Math.cos(t * 0.52) * 75;
      targetX = pathX;
      targetY = (RENDER_HEIGHT * 0.34) * (1 - introOrb) + pathY * introOrb;
    }

    ctx.save();
    ctx.globalAlpha = introOrb;
    drawTargetOrb(targetX, targetY, t, introOrb);
    ctx.restore();

    if (introScorpion > 0.01) {
      ctx.save();
      ctx.globalAlpha = introScorpion;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#38f6ff';
      ctx.fillStyle = '#c8ffff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 18 * introScorpion;

      critter.follow(targetX, targetY);

      ctx.shadowBlur = 6 * introScorpion;
      ctx.strokeStyle = 'rgba(215, 252, 255, 0.72)';
      critter.draw(true);
      ctx.restore();
    }
  }

  requestAnimationFrame(animate);
</script>
